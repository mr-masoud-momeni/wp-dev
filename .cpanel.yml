---
deployment:
  tasks:
    # مسیر ریپو
    - export REPOPATH=/home/isbtoevq/repo/

    # مسیر سایت
    - export DEPLOYPATH=/home/isbtoevq/public_html/

    # قالب پروژه
    - /bin/rsync -av $REPOPATH/wp-content/themes/digikala-theme/ $DEPLOYPATH/wp-content/themes/digikala-theme/

    # پلاگین‌های پروژه
    - /bin/rsync -av $REPOPATH/wp-content/plugins/ $DEPLOYPATH/wp-content/plugins/
